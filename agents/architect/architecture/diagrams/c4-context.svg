  <rect x="910" y="420" width="170" height="60" rx="10" fill="#1c2750" stroke="#2a3358"/>
  <text x="995" y="445" text-anchor="middle" fill="#e8ecff" font-size="13">云基础设施</text>
  <text x="995" y="465" text-anchor="middle" fill="#aab2d5" font-size="11">· 腾讯云 · COS · CDN</text>

