  <text x="105" y="105" text-anchor="middle" fill="#e8ecff" font-size="13">单身用户 A（女）</text>
  <text x="105" y="125" text-anchor="middle" fill="#aab2d5" font-size="11">· 微信小程序/App ·</text>

  <rect x="20" y="180" width="170" height="60" rx="10" fill="#1c2750" stroke="#2a3358"/>
  <text x="105" y="205" text-anchor="middle" fill="#e8ecff" font-size="13">单身用户 B（男）</text>
  <text x="105" y="225" text-anchor="middle" fill="#aab2d5" font-size="11">· 微信小程序/App ·</text>

  <rect x="20" y="280" width="170" height="60" rx="10" fill="#1c2750" stroke="#2a3358"/>
