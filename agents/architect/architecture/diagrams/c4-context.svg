  <text x="105" y="425" text-anchor="middle" fill="#aab2d5" font-size="11">· 算法备案 · 实名核验 ·</text>

  <rect x="20" y="480" width="170" height="60" rx="10" fill="#1c2750" stroke="#2a3358"/>
